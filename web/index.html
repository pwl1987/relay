<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Relay · 工作台</title>
    <link rel="icon" href="data:," />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f4f5f7" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="app-header" id="app-header"></header>
    <main>
      <div id="conn-banner" hidden data-testid="conn-banner"></div>

      <div class="toolbar toolbar-sub">
        <span class="small dim" id="data-stamp" data-testid="data-stamp"></span>
        <span class="spacer"></span>
        <button class="btn btn-ghost btn-sm" id="btn-refresh" type="button" data-testid="btn-refresh">刷新</button>
        <button class="btn btn-ghost btn-sm" id="btn-tick" type="button" data-testid="btn-tick">推进一拍</button>
      </div>

      <!-- WEB-UX-02 §5:首屏=一句话开始 -->
      <section class="hero" id="new-goal">
        <h1 class="hero-title">今天想让 Relay 做什么?</h1>
        <p class="hero-sub">选择项目,用一句话说出需求。Relay 会自动理解、修改、测试、复核并交付。</p>
        <div id="new-goal-form"><span class="empty">正在准备…</span></div>
      </section>

      <!-- WEB-UX-02 §6:首页只保留用户真正关心的四区 -->
      <section class="card mt14" id="sec-active">
        <h2>正在处理</h2>
        <div id="active-body" data-testid="active-body"><span class="empty">读取中…</span></div>
      </section>

      <div class="grid mt14">
        <section class="card" id="sec-decisions">
          <h2>等待我决定<span id="home-decision-count" class="count-chip" hidden></span></h2>
          <div id="decisions-summary" data-testid="decisions-summary"><span class="empty">读取中…</span></div>
          <p class="small mt8" id="decisions-more" hidden><a href="/decisions.html">全部待决定事项 →</a></p>
        </section>

        <section class="card" id="sec-recent">
          <h2>最近完成</h2>
          <div id="recent-body" data-testid="recent-body"><span class="empty">读取中…</span></div>
        </section>
      </div>

      <section class="card mt14" id="sec-issues">
        <h2>有问题</h2>
        <div id="issues-body" data-testid="issues-body"><span class="empty">读取中…</span></div>
        <div class="mt8" id="anomalies-wrap" data-testid="anomalies-body"></div>
      </section>
    </main>
    <script src="/app.js"></script>
    <script src="/dashboard.js"></script>
  </body>
</html>
