<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Relay 控制台 · Goal</title>
    <link rel="icon" href="data:," />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0f1115" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="app-header" id="app-header"></header>
    <main>
      <div id="conn-banner" hidden data-testid="conn-banner"></div>
      <div class="toolbar">
        <h1 id="page-title">Goal</h1>
        <span class="spacer"></span>
        <span class="small dim" id="data-stamp" data-testid="data-stamp"></span>
        <button class="btn" id="btn-refresh" type="button" data-testid="btn-refresh">刷新</button>
      </div>

      <section class="card" id="create-card" hidden>
        <h2>新建 Goal</h2>
        <div id="new-goal-form"><span class="empty">读取项目注册表…</span></div>
      </section>

      <div id="goal-detail" data-testid="goal-detail" hidden>
        <section class="card" id="progress-card">
          <h2>执行进度</h2>
          <div id="goal-progress" data-testid="goal-progress"></div>
        </section>

        <section class="card mt14">
          <h2>执行 Timeline</h2>
          <p class="small dim">阶段推导=确定性(来自数据库事实:任务状态/运行/证据/裁决/交付),非模型判断。</p>
          <div id="goal-timeline" data-testid="goal-timeline"></div>
        </section>

        <section class="card mt14">
          <h2>目标与验收</h2>
          <div id="goal-header" data-testid="goal-header"></div>
        </section>

        <section class="card mt14">
          <h2>系统理解与可验证建议</h2>
          <div id="goal-analysis" data-testid="goal-analysis"></div>
        </section>

        <section class="card mt14">
          <h2>任务进度</h2>
          <div id="goal-tasks" data-testid="goal-tasks"></div>
        </section>

        <section class="card mt14">
          <h2>候选变更与交付</h2>
          <div id="goal-changesets" data-testid="goal-changesets"></div>
        </section>

        <section class="card mt14">
          <h2>运行记录</h2>
          <div id="goal-runs" data-testid="goal-runs"></div>
        </section>

        <details class="tech-details mt14" id="goal-tech">
          <summary class="dim small">技术细节(证据 / Gate 裁决 / 审计轨迹)</summary>
          <section class="card mt14">
            <h2>执行证据</h2>
            <div id="goal-evidence" data-testid="goal-evidence"></div>
          </section>

          <section class="card mt14">
            <h2>Gate 裁决</h2>
            <div id="goal-gates" data-testid="goal-gates"></div>
          </section>

          <section class="card mt14">
            <h2>审计轨迹</h2>
            <div id="goal-audit" data-testid="goal-audit"></div>
          </section>
        </details>
      </div>
    </main>
    <script src="/app.js"></script>
    <script src="/goal.js"></script>
  </body>
</html>
