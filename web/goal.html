<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Relay · 任务</title>
    <link rel="icon" href="data:," />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f4f5f7" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="app-header" id="app-header"></header>
    <main>
      <div id="conn-banner" hidden data-testid="conn-banner"></div>
      <div class="toolbar">
        <h1 id="page-title">任务</h1>
        <span class="spacer"></span>
        <span class="small dim" id="data-stamp" data-testid="data-stamp"></span>
        <button class="btn btn-ghost btn-sm" id="btn-refresh" type="button" data-testid="btn-refresh">刷新</button>
      </div>

      <!-- 无 id:任务列表(WEB-UX-02:创建需求在工作台/项目页,本页只看进度) -->
      <section class="card" id="list-card" hidden>
        <h2>全部任务</h2>
        <div id="goals-list" data-testid="goals-list"><span class="empty">读取中…</span></div>
      </section>

      <div id="goal-detail" data-testid="goal-detail" hidden>
        <!-- WEB-UX-02 §9:主视图=时间线;技术细节折叠 -->
        <section class="card goal-hero">
          <div id="goal-hero" data-testid="goal-hero"></div>
          <p class="small dim mt8">进度由系统事实确定性推导,不是模型判断。</p>
          <div id="goal-timeline" data-testid="goal-timeline"></div>
        </section>

        <details class="tech-details mt14" id="goal-tech">
          <summary class="dim">查看技术详情(进度 / 理解与建议 / 任务 / 运行 / Gate / 证据 / 审计)</summary>

          <section class="card mt14">
            <h2>执行进度</h2>
            <div id="goal-progress" data-testid="goal-progress"></div>
          </section>

          <section class="card mt14">
            <h2>目标与验收</h2>
            <div id="goal-header" data-testid="goal-header"></div>
          </section>

          <section class="card mt14">
            <h2>系统理解与可验证建议</h2>
            <div id="goal-analysis" data-testid="goal-analysis"></div>
          </section>

          <section class="card mt14">
            <h2>任务进度</h2>
            <div id="goal-tasks" data-testid="goal-tasks"></div>
          </section>

          <section class="card mt14">
            <h2>候选变更与交付</h2>
            <div id="goal-changesets" data-testid="goal-changesets"></div>
          </section>

          <section class="card mt14">
            <h2>运行记录</h2>
            <div id="goal-runs" data-testid="goal-runs"></div>
          </section>

          <section class="card mt14">
            <h2>执行证据</h2>
            <div id="goal-evidence" data-testid="goal-evidence"></div>
          </section>

          <section class="card mt14">
            <h2>Gate 裁决</h2>
            <div id="goal-gates" data-testid="goal-gates"></div>
          </section>

          <section class="card mt14">
            <h2>审计轨迹</h2>
            <div id="goal-audit" data-testid="goal-audit"></div>
          </section>
        </details>
      </div>
    </main>
    <script src="/app.js"></script>
    <script src="/goal.js"></script>
  </body>
</html>
