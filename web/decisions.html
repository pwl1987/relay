<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Relay · 待我决定</title>
    <link rel="icon" href="data:," />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f4f5f7" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="app-header" id="app-header"></header>
    <main>
      <div id="conn-banner" hidden data-testid="conn-banner"></div>
      <div class="toolbar">
        <h1>待我决定</h1>
        <span class="spacer"></span>
        <span class="small dim" id="data-stamp" data-testid="data-stamp"></span>
        <button class="btn btn-ghost btn-sm" id="btn-refresh" type="button" data-testid="btn-refresh">刷新</button>
      </div>

      <!-- WEB-UX-02 §10:用户语言;铁律不变(永不自动批准/无批量批准入口) -->
      <div class="notice info" data-testid="d3-policy-notice">
        <strong>Relay 永不自动批准。</strong>
        <span
          >这里列出的事都需要你亲自拍板:不会因为超时就自动通过,也没有"批量批准"入口。
          每一项都会告诉你发生了什么、系统推荐怎么办、为什么、以及风险是什么。"稍后决定"只是延后提醒,不算批准。</span
        >
      </div>

      <section class="card mt14">
        <h2>等你处理</h2>
        <div id="decisions-open" data-testid="decisions-open"><span class="empty">读取中…</span></div>
      </section>

      <section class="card mt14">
        <h2>已处理</h2>
        <div id="decisions-history" data-testid="decisions-history"><span class="empty">读取中…</span></div>
      </section>
    </main>
    <script src="/app.js"></script>
    <script src="/decisions.js"></script>
  </body>
</html>
