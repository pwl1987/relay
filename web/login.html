<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Relay · 登录</title>
    <link rel="icon" href="data:," />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f4f5f7" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="login-wrap">
    <h1 class="brand brand-lg">Relay</h1>
    <p class="login-sub">AI 软件开发工作台</p>
    <div class="card">
      <label for="password">操作口令</label>
      <input id="password" type="password" autocomplete="current-password" />
      <div class="err" id="login-error" data-testid="login-error"></div>
      <div class="row mt10">
        <button id="btn-login" class="btn btn-primary" type="button" data-testid="login-submit">登录</button>
      </div>
      <p class="small dim mt14">
        口令只用于服务端加密比对,不会写入日志或响应;会话保存在服务器端,Cookie 为 HttpOnly + SameSite=Strict。
        写操作还需要 CSRF 令牌与状态版本校验。
      </p>
    </div>
    <script src="/app.js"></script>
    <script src="/login.js"></script>
  </body>
</html>
